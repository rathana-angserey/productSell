<!doctype html>
<html
  :class="{ 'dark': darkMode }"
  lang="en"
  x-data="appData()"
  x-init="init()"
>
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title x-text="i18n[lang].title">Golden Hour Pub Showcase</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/@alpinejs/intersect@3.x.x/dist/cdn.min.js"
    ></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"
    ></script>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+Khmer:wght@400;600;700&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#1d4ed8",
              "primary-light": "#3b82f6",
              "primary-dark": "#1e3a8a",
              accent: "#0ea5e9",
              background: "#f4f8ff",
              "background-dark": "#060b18",
              surface: "#ffffff",
              "surface-dark": "#0d1526",
              "on-surface": "#101a33",
              "on-surface-dark": "#e6ecff",
              "on-surface-variant": "#5b6b8c",
              "on-surface-variant-dark": "#8b9ac2",
              outline: "#c7d4ef",
              "outline-dark": "#233256",
              "glass-white": "rgba(255, 255, 255, 0.72)",
              "glass-dark": "rgba(13, 21, 38, 0.72)",
            },
            spacing: {
              margin_desktop: "48px",
              gutter: "24px",
              stack_lg: "32px",
              container_max: "1280px",
              margin_mobile: "16px",
            },
          },
        },
      };
    </script>
    <style>
      html {
        scroll-behavior: smooth;
      }
      .font-app {
        font-family: "Sora", sans-serif;
      }
      .font-app-km {
        font-family: "Noto Serif Khmer", serif;
      }
      [x-cloak] {
        display: none !important;
      }
      body {
        min-height: max(884px, 100dvh);
        background: linear-gradient(
          180deg,
          #eef4ff 0%,
          #f4f8ff 40%,
          #ffffff 100%
        );
      }
      .dark body {
        background: linear-gradient(
          180deg,
          #060b18 0%,
          #0a1120 45%,
          #0d1526 100%
        );
      }
      .brand-gradient {
        background: linear-gradient(
          135deg,
          #1d4ed8 0%,
          #3b82f6 55%,
          #0ea5e9 100%
        );
      }
      .brand-gradient-text {
        background: linear-gradient(135deg, #1d4ed8, #0ea5e9);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .glass-shadow {
        box-shadow: 0 8px 32px 0 rgba(29, 78, 216, 0.08);
      }
      .dark .glass-shadow {
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.35);
      }
      .fade-slide-up {
        opacity: 0;
        transform: translateY(20px);
        transition:
          opacity 0.6s ease-out,
          transform 0.6s ease-out;
      }
      .fade-slide-up.is-visible {
        opacity: 1;
        transform: translateY(0);
      }
      .price-chip {
        background: linear-gradient(135deg, #1d4ed8, #0ea5e9);
      }
      .spinner {
        border: 3px solid rgba(29, 78, 216, 0.15);
        border-top-color: #1d4ed8;
        border-radius: 50%;
        width: 32px;
        height: 32px;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body
    :class="lang === 'km' ? 'font-app-km' : 'font-app'"
    class="text-on-surface dark:text-on-surface-dark transition-colors duration-300"
  >
    <header
      :class="isScrolled ? 'h-[60px] shadow-md' : 'h-[72px] md:h-[80px] shadow-sm'"
      class="bg-glass-white dark:bg-glass-dark backdrop-blur-lg fixed top-0 w-full z-50 border-b border-primary/10 dark:border-white/10 transition-all duration-300 flex items-center"
    >
      <div
        class="max-w-container_max w-full mx-auto flex flex-row justify-between items-center px-margin_mobile md:px-margin_desktop gap-2 md:gap-4"
      >
        <div class="flex items-center gap-2 md:gap-3">
          <div
            :class="isScrolled ? 'h-8 w-8 text-xs' : 'h-10 w-10 text-base'"
            class="rounded-full brand-gradient flex items-center justify-center text-white font-bold shadow-md transition-all duration-300"
          >
            GH
          </div>
          <h1
            :class="isScrolled ? 'text-lg' : 'text-xl'"
            class="font-bold brand-gradient-text tracking-tight transition-all duration-300 hidden sm:block whitespace-nowrap"
          >
            Golden Hour Pub
          </h1>
        </div>
        <div
          class="flex items-center gap-2 md:gap-3 w-full sm:w-auto justify-end"
        >
          <div class="relative w-full max-w-[160px] md:max-w-[220px]">
            <span
              class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant dark:text-on-surface-variant-dark text-[18px]"
              >search</span
            >
            <input
              :placeholder="i18n[lang].searchPlaceholder"
              class="w-full pl-9 pr-3 py-1.5 md:py-2 bg-white/60 dark:bg-black/30 border border-outline dark:border-outline-dark rounded-full focus:outline-none focus:border-primary dark:focus:border-primary-light transition-colors text-xs md:text-sm"
              type="text"
              x-model="search"
            />
          </div>
          <button
            @click="toggleLang()"
            class="text-primary dark:text-primary-light font-medium text-xs md:text-sm px-3 py-1.5 md:px-4 md:py-2 border border-outline dark:border-outline-dark bg-white/60 dark:bg-black/30 rounded-full shadow-sm hover:bg-primary transition-colors duration-300"
          >
            <span x-text="lang === 'en' ? 'ខ្មែរ' : 'EN'"></span>
          </button>
          <button
            @click="toggleDark()"
            class="text-primary dark:text-primary-light flex items-center justify-center h-8 w-8 md:h-10 md:w-10 rounded-full bg-white/60 dark:bg-black/30 border border-outline dark:border-outline-dark shadow-sm hover:bg-primary transition-colors duration-300"
          >
            <span
              class="material-symbols-outlined text-[18px] md:text-[22px]"
              x-text="darkMode ? 'light_mode' : 'dark_mode'"
            ></span>
          </button>
          <a
            href="admin.html"
            title="Admin Login"
            class="text-primary dark:text-primary-light flex items-center justify-center h-8 w-8 md:h-10 md:w-10 rounded-full bg-white/60 dark:bg-black/30 border border-outline dark:border-outline-dark shadow-sm hover:bg-primary hover:text-white transition-colors duration-300"
          >
            <span class="material-symbols-outlined text-[18px] md:text-[22px]"
              >login</span
            >
          </a>
        </div>
      </div>
    </header>

    <main class="pt-[72px] md:pt-[80px] pb-stack_lg">
      <section
        class="relative w-full h-[35vh] min-h-[300px] md:min-h-[420px] flex items-center justify-center mb-stack_lg overflow-hidden"
      >
        <div class="absolute inset-0 brand-gradient"></div>
        <div class="absolute inset-0 bg-black/10"></div>
        <div
          class="relative z-10 text-center px-margin_mobile fade-slide-up"
          x-intersect="$el.classList.add('is-visible')"
        >
          <div
            class="bg-white/15 backdrop-blur-md border border-white/25 p-6 md:p-12 rounded-3xl glass-shadow"
          >
            <h2
              class="text-3xl md:text-5xl lg:text-6xl font-bold mb-4 md:mb-6 text-white tracking-tight"
              x-text="i18n[lang].heroTitle"
            >
              Craft Drinks &amp; Comfort Food
            </h2>
            <p
              class="text-sm md:text-lg text-white/90 max-w-2xl mx-auto leading-relaxed"
              x-text="i18n[lang].heroSubtitle"
            >
              Experience the perfect blend of artisanal brewing and culinary
              excellence.
            </p>
          </div>
        </div>
      </section>

      <div
        :class="isScrolled ? 'top-[60px] py-2.5 shadow-md' : 'top-[72px] md:top-[80px] py-4 glass-shadow'"
        class="sticky z-40 bg-glass-white/95 dark:bg-glass-dark/95 backdrop-blur-xl border-b border-primary/10 dark:border-white/10 mb-stack_lg transition-all duration-300 w-full"
        x-show="!loading && !loadError"
        x-cloak
      >
        <div
          class="max-w-container_max mx-auto px-margin_mobile md:px-margin_desktop flex justify-start gap-2 md:gap-3 overflow-x-auto no-scrollbar scroll-smooth snap-x"
          id="category-container"
        >
          <template :key="cat.catid" x-for="cat in activeCategoryList">
            <button
              :id="'btn-cat-' + cat.catid"
              @click="scrollToCategory(cat.catid)"
              :class="activeCategory === cat.catid ? 'brand-gradient text-white border-transparent shadow-md' : 'bg-white/60 dark:bg-black/30 text-on-surface-variant dark:text-on-surface-variant-dark border-outline dark:border-outline-dark hover:border-primary dark:hover:border-primary-light'"
              class="px-4 py-1.5 md:px-6 md:py-2 rounded-full text-xs md:text-sm font-medium capitalize whitespace-nowrap transition-all duration-300 border snap-start"
              x-text="lang === 'en' ? cat.catnameen : cat.catnamekh"
            ></button>
          </template>
          <div class="min-w-[1px] md:min-w-[16px]"></div>
        </div>
      </div>

      <section
        class="max-w-container_max mx-auto px-margin_mobile md:px-margin_desktop"
      >
        <div
          class="flex flex-col items-center justify-center py-24 gap-4"
          x-show="loading"
          x-cloak
        >
          <div class="spinner"></div>
          <p
            class="text-on-surface-variant dark:text-on-surface-variant-dark text-sm"
            x-text="i18n[lang].loading"
          >
            Loading menu...
          </p>
        </div>

        <div class="text-center py-16 text-red-500" x-show="loadError" x-cloak>
          <p x-text="i18n[lang].loadError">
            Could not load the menu. Please refresh.
          </p>
        </div>

        <template x-for="group in groupedProducts" :key="group.id">
          <div
            :id="'category-' + group.id"
            class="mb-16 scroll-mt-[220px] md:scroll-mt-[160px]"
            x-show="!loading && !loadError"
            x-cloak
          >
            <div
              class="flex items-center gap-4 mb-8 fade-slide-up"
              x-intersect="$el.classList.add('is-visible')"
            >
              <h2
                class="text-2xl md:text-3xl font-bold text-on-surface dark:text-on-surface-dark"
                x-text="group.label"
              ></h2>
              <div
                class="flex-grow h-px bg-outline dark:bg-outline-dark mt-2"
              ></div>
            </div>

            <div
              class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-gutter"
            >
              <template :key="item.proid" x-for="(item, index) in group.items">
                <div
                  @click="openModal(item)"
                  class="bg-surface dark:bg-surface-dark border border-outline/60 dark:border-outline-dark rounded-2xl overflow-hidden glass-shadow hover:shadow-xl hover:-translate-y-1 transition-all duration-300 group cursor-pointer fade-slide-up flex flex-col"
                  x-intersect="$el.classList.add('is-visible')"
                  :style="'transition-delay: ' + ((index % 4) * 60) + 'ms'"
                >
                  <div class="relative h-44 overflow-hidden">
                    <img
                      :alt="lang === 'en' ? item.pronameen : item.pronamekh"
                      :src="item.proimageurl"
                      class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
                      onerror="
                        this.src = 'https://placehold.co/400x300?text=No+Image'
                      "
                    />
                  </div>
                  <div class="p-5 pt-4 flex flex-col flex-grow">
                    <div class="flex items-start justify-between gap-2">
                      <h3
                        class="text-lg font-bold text-on-surface dark:text-on-surface-dark leading-snug"
                        x-text="lang === 'en' ? item.pronameen : item.pronamekh"
                      ></h3>
                      <span
                        class="price-chip text-white text-sm font-semibold px-3 py-1 rounded-full whitespace-nowrap shadow-sm"
                        x-text="formatPrice(item.proprice)"
                      ></span>
                    </div>
                    <div
                      class="border-t border-dashed border-outline dark:border-outline-dark my-4 mt-auto"
                    ></div>
                    <div class="flex justify-between text-center">
                      <div
                        class="flex flex-col items-center flex-1 pr-4 border-r border-outline/60 dark:border-outline-dark/60"
                      >
                        <span
                          class="text-[11px] uppercase tracking-wide text-on-surface-variant dark:text-on-surface-variant-dark"
                          x-text="i18n[lang].details"
                        ></span>
                        <span
                          class="font-semibold text-sm text-on-surface dark:text-on-surface-dark mt-0.5 line-clamp-1"
                          x-text="lang === 'en' ? item.prodescriptionen : item.prodescriptionkh"
                        ></span>
                      </div>
                      <div class="flex flex-col items-center flex-1 pl-4">
                        <span
                          class="text-[11px] uppercase tracking-wide text-on-surface-variant dark:text-on-surface-variant-dark"
                          x-text="i18n[lang].price"
                        ></span>
                        <span
                          class="font-semibold text-sm text-primary dark:text-primary-light mt-0.5"
                          x-text="formatPrice(item.proprice)"
                        ></span>
                      </div>
                    </div>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </template>

        <div
          class="text-center py-stack_lg text-on-surface-variant dark:text-on-surface-variant-dark"
          x-cloak
          x-show="!loading && !loadError && groupedProducts.length === 0"
        >
          <span class="material-symbols-outlined text-4xl mb-2 opacity-50"
            >search_off</span
          >
          <p x-text="i18n[lang].noResults">No items found.</p>
        </div>
      </section>
    </main>

    <footer
      class="bg-glass-white dark:bg-glass-dark backdrop-blur-lg border-t border-primary/10 dark:border-white/10 w-full mt-stack_lg"
    >
      <div
        class="max-w-container_max mx-auto px-margin_mobile md:px-margin_desktop py-8 text-center"
      >
        <p
          class="text-on-surface-variant dark:text-on-surface-variant-dark text-xs"
          x-text="i18n[lang].copyright"
        >
          © 2024 Golden Hour Gastropub. All rights reserved.
        </p>
      </div>
    </footer>

    <div
      class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-primary-dark/40 backdrop-blur-sm"
      x-cloak
      x-show="isModalOpen"
      x-transition:enter="transition ease-out duration-300"
      x-transition:enter-start="opacity-0"
      x-transition:enter-end="opacity-100"
      x-transition:leave="transition ease-in duration-200"
      x-transition:leave-start="opacity-100"
      x-transition:leave-end="opacity-0"
    >
      <div
        @click.away="closeModal()"
        class="bg-surface dark:bg-surface-dark border border-outline dark:border-outline-dark rounded-3xl shadow-2xl max-w-3xl w-full max-h-[85vh] overflow-y-auto overflow-hidden"
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0 translate-y-8 scale-95"
        x-transition:enter-end="opacity-100 translate-y-0 scale-100"
        x-transition:leave="transition ease-in duration-200"
        x-transition:leave-start="opacity-100 translate-y-0 scale-100"
        x-transition:leave-end="opacity-0 translate-y-8 scale-95"
      >
        <template x-if="selectedProduct">
          <div class="flex flex-col md:flex-row h-full">
            <div class="w-full md:w-1/2 h-64 md:h-auto relative">
              <img
                :alt="lang === 'en' ? selectedProduct.pronameen : selectedProduct.pronamekh"
                :src="selectedProduct.proimageurl"
                class="w-full h-full object-cover"
                onerror="
                  this.src = 'https://placehold.co/400x300?text=No+Image'
                "
              />
              <button
                @click="closeModal()"
                class="absolute top-4 right-4 md:hidden bg-white/70 dark:bg-black/50 backdrop-blur-md rounded-full p-2 text-on-surface dark:text-on-surface-dark border border-white/40"
              >
                <span class="material-symbols-outlined">close</span>
              </button>
            </div>
            <div class="w-full md:w-1/2 p-8 flex flex-col justify-center">
              <div class="flex justify-between items-start mb-6">
                <div
                  class="bg-primary/10 dark:bg-primary-light/10 text-primary dark:text-primary-light px-4 py-1.5 rounded-full text-xs font-medium inline-block"
                >
                  <span
                    x-text="categoryName(selectedProduct.procategoryid)"
                  ></span>
                </div>
                <button
                  @click="closeModal()"
                  class="hidden md:flex items-center justify-center h-10 w-10 bg-black/5 dark:bg-white/10 rounded-full text-on-surface-variant dark:text-on-surface-variant-dark hover:text-primary dark:hover:text-primary-light transition-colors"
                >
                  <span class="material-symbols-outlined">close</span>
                </button>
              </div>
              <h2
                class="text-2xl font-bold text-on-surface dark:text-on-surface-dark mb-2 tracking-tight"
                x-text="lang === 'en' ? selectedProduct.pronameen : selectedProduct.pronamekh"
              ></h2>
              <p
                class="text-xl font-bold brand-gradient-text mb-6"
                x-text="formatPrice(selectedProduct.proprice)"
              ></p>
              <div>
                <h4
                  class="text-xs uppercase tracking-widest text-on-surface-variant dark:text-on-surface-variant-dark mb-2"
                  x-text="i18n[lang].details"
                >
                  Description
                </h4>
                <p
                  class="text-on-surface dark:text-on-surface-dark leading-relaxed opacity-90"
                  x-text="lang === 'en' ? selectedProduct.prodescriptionen : selectedProduct.prodescriptionkh"
                ></p>
              </div>
            </div>
          </div>
        </template>
      </div>
    </div>

    <script>
      const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";
      const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
      const supabase = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
      );

      function appData() {
        return {
          darkMode: false,
          lang: "en",
          search: "",
          isScrolled: false,
          activeCategory: null,
          isModalOpen: false,
          selectedProduct: null,
          loading: true,
          loadError: false,
          products: [],
          categories: [],

          async init() {
            try {
              const { data: catData, error: catError } = await supabase
                .from("categories")
                .select("*");
              const { data: proData, error: proError } = await supabase
                .from("products")
                .select("*")
                .eq("status", "active");

              if (catError) throw catError;
              if (proError) throw proError;

              this.categories = catData;
              this.products = proData;
              if (this.categories.length > 0)
                this.activeCategory = this.categories[0].catid;
              this.loading = false;
            } catch (err) {
              console.error(err);
              this.loadError = true;
              this.loading = false;
            }

            window.addEventListener("scroll", () => {
              this.isScrolled = window.scrollY > 20;
              this.checkActiveCategory();
            });
          },

          get activeCategoryList() {
            return this.categories.filter((cat) =>
              this.products.some((p) => p.procategoryid === cat.catid),
            );
          },

          get groupedProducts() {
            let baseItems = this.products;
            if (this.search.trim() !== "") {
              const searchTerm = this.search.toLowerCase();
              baseItems = baseItems.filter(
                (item) =>
                  item.pronameen.toLowerCase().includes(searchTerm) ||
                  item.pronamekh.includes(searchTerm) ||
                  item.prodescriptionen.toLowerCase().includes(searchTerm),
              );
            }
            return this.activeCategoryList
              .map((cat) => ({
                id: cat.catid,
                label: this.lang === "en" ? cat.catnameen : cat.catnamekh,
                items: baseItems.filter(
                  (item) => item.procategoryid === cat.catid,
                ),
              }))
              .filter((group) => group.items.length > 0);
          },

          checkActiveCategory() {
            if (this.loading) return;
            const scrollPos = window.scrollY + 130;
            let currentCat = this.activeCategory;
            const groups = this.groupedProducts;
            for (let i = groups.length - 1; i >= 0; i--) {
              const el = document.getElementById("category-" + groups[i].id);
              if (el && scrollPos >= el.offsetTop) {
                currentCat = groups[i].id;
                break;
              }
            }
            if (currentCat !== this.activeCategory) {
              this.activeCategory = currentCat;
              const btn = document.getElementById("btn-cat-" + currentCat);
              const container = document.getElementById("category-container");
              if (btn && container) {
                const scrollLeft =
                  btn.offsetLeft -
                  container.offsetWidth / 2 +
                  btn.offsetWidth / 2;
                container.scrollTo({ left: scrollLeft, behavior: "smooth" });
              }
            }
          },

          scrollToCategory(catid) {
            this.activeCategory = catid;
            const el = document.getElementById("category-" + catid);
            if (el)
              window.scrollTo({
                top: el.getBoundingClientRect().top + window.scrollY - 110,
                behavior: "smooth",
              });
          },

          categoryName(catid) {
            const cat = this.categories.find((c) => c.catid === catid);
            if (!cat) return "";
            return this.lang === "en" ? cat.catnameen : cat.catnamekh;
          },

          i18n: {
            en: {
              title: "Golden Hour Pub Showcase",
              searchPlaceholder: "Search menu...",
              heroTitle: "Craft Drinks & Comfort Food",
              heroSubtitle:
                "Experience the perfect blend of artisanal brewing and culinary excellence.",
              details: "Description",
              price: "Price",
              noResults: "No items match your search.",
              loading: "Loading menu...",
              loadError: "Could not load the menu. Please refresh.",
              copyright: "© 2024 Golden Hour Gastropub. All rights reserved.",
            },
            km: {
              title: "ពិព័រណ៍ហ្គោលដេនហៅអ័រផាប់",
              searchPlaceholder: "ស្វែងរកមុខម្ហូប...",
              heroTitle: "ភេសជ្ជៈសិប្បកម្ម & អាហារសម្រន់",

            return `$${Number(price).toFixed(2)}`;

          openModal(product) {
            this.selectedProduct = product;

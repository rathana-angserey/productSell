<!doctype html>
<html
  :class="{ 'dark': darkMode }"
  lang="en"
  x-data="adminApp()"
  x-init="init()"
>
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Golden Hour Pub — Admin</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"
    ></script>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+Khmer:wght@400;600;700&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#1d4ed8",
              "primary-light": "#3b82f6",
              accent: "#0ea5e9",
              background: "#f4f8ff",
              "background-dark": "#060b18",
              surface: "#ffffff",
              "surface-dark": "#0d1526",
              "on-surface": "#101a33",
              "on-surface-dark": "#e6ecff",
              "on-surface-variant": "#5b6b8c",
              outline: "#c7d4ef",
              "outline-dark": "#233256",
              "glass-white": "rgba(255, 255, 255, 0.72)",
              "glass-dark": "rgba(13, 21, 38, 0.72)",
            },
            fontFamily: {
              app: ["Sora", "sans-serif"],
              "app-km": ['"Noto Serif Khmer"', "serif"],
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Sora", sans-serif;
        background: linear-gradient(
          180deg,
          #eef4ff 0%,
          #f4f8ff 40%,
          #ffffff 100%
        );
        min-height: 100vh;
      }
      .dark body {
        background: linear-gradient(
          180deg,
          #060b18 0%,
          #0a1120 45%,
          #0d1526 100%
        );
      }
      [x-cloak] {
        display: none !important;
      }
      .brand-gradient {
        background: linear-gradient(
          135deg,
          #1d4ed8 0%,
          #3b82f6 55%,
          #0ea5e9 100%
        );
      }
      .brand-gradient-text {
        background: linear-gradient(135deg, #1d4ed8, #0ea5e9);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .glass-shadow {
        box-shadow: 0 8px 32px 0 rgba(29, 78, 216, 0.08);
      }
      .dark .glass-shadow {
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.35);
      }
      .spinner {
        border: 3px solid rgba(29, 78, 216, 0.15);
        border-top-color: #1d4ed8;
        border-radius: 50%;
        width: 24px;
        height: 24px;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body
    class="text-on-surface dark:text-on-surface-dark transition-colors duration-300"
  >
    <!-- Modern Login Gate matching the Website's Design System -->
    <div
      class="min-h-screen flex items-center justify-center p-4 relative z-50"
      x-show="!authed"
      x-cloak
    >
      <div
        class="absolute inset-0 bg-white/20 backdrop-blur-sm dark:bg-black/40"
      ></div>

      <div
        class="relative w-full max-w-[360px] overflow-hidden rounded-3xl bg-glass-white dark:bg-glass-dark backdrop-blur-xl p-8 border border-outline dark:border-outline-dark glass-shadow transform transition-all"
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0 scale-95"
        x-transition:enter-end="opacity-100 scale-100"
        x-transition:leave="transition ease-in duration-200"
        x-transition:leave-start="opacity-100 scale-100"
        x-transition:leave-end="opacity-0 scale-95"
      >
        <div class="mb-8 text-center">
          <div
            class="mx-auto h-14 w-14 rounded-full brand-gradient flex items-center justify-center text-white font-bold shadow-md mb-5 text-lg"
          >
            GH
          </div>
          <h2
            class="text-2xl font-bold tracking-tight text-on-surface dark:text-on-surface-dark"
          >
            Welcome back
          </h2>
          <p
            class="mt-2 text-sm text-on-surface-variant dark:text-on-surface-variant-dark"
          >
            Sign in to manage portal
          </p>
        </div>

        <!-- Admin Email Field for Supabase -->
        <div class="relative mb-4">
          <span
            class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 h-5 w-5 text-on-surface-variant dark:text-on-surface-variant-dark text-[20px] flex items-center justify-center"
            >mail</span
          >
          <input
            type="email"
            x-model="emailInput"
            placeholder="Admin email"
            class="h-12 w-full rounded-full border border-outline dark:border-outline-dark bg-white/60 dark:bg-black/30 pl-10 pr-6 text-sm outline-none transition-all focus:border-primary dark:focus:border-primary-light focus:bg-white dark:focus:bg-black/50 text-on-surface dark:text-on-surface-dark placeholder:text-on-surface-variant/70"
          />
        </div>

        <!-- Password Input Field -->
        <div class="relative mb-6">
          <span
            class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 h-5 w-5 text-on-surface-variant dark:text-on-surface-variant-dark text-[20px] flex items-center justify-center"
            >lock</span
          >
          <input
            :type="showPassword ? 'text' : 'password'"
            x-model="passwordInput"
            @keydown.enter="login()"
            placeholder="Password"
            class="h-12 w-full rounded-full border border-outline dark:border-outline-dark bg-white/60 dark:bg-black/30 pl-10 pr-24 text-sm outline-none transition-all focus:border-primary dark:focus:border-primary-light focus:bg-white dark:focus:bg-black/50 text-on-surface dark:text-on-surface-dark placeholder:text-on-surface-variant/70"
          />
          <button
            type="button"
            @click="showPassword = !showPassword"
            class="absolute right-12 top-1/2 -translate-y-1/2 flex items-center justify-center h-8 w-8 text-on-surface-variant dark:text-on-surface-variant-dark hover:text-primary dark:hover:text-primary-light transition-colors focus:outline-none"
            title="Toggle password visibility"
          >
            <span
              class="material-symbols-outlined text-[20px] transition-transform duration-300 ease-in-out"
              :class="showPassword ? 'scale-110' : 'scale-100'"
              x-text="showPassword ? 'visibility_off' : 'visibility'"
            ></span>
          </button>

          <!-- Submit Arrow -->
          <button
            @click="login()"
            class="absolute right-1.5 top-1/2 -translate-y-1/2 rounded-full h-9 w-9 flex items-center justify-center brand-gradient text-white transition-transform hover:scale-105 active:scale-95 shadow-md focus:outline-none"
          >
            <div
              class="spinner !border-white/30 !border-top-white !w-4 !h-4 absolute"
              x-show="loadingList"
            ></div>
            <span
              class="material-symbols-outlined text-[18px]"
              x-show="!loadingList"
              >arrow_forward</span
            >
          </button>
        </div>

        <p
          class="text-red-500 text-xs text-center transition-opacity duration-300 h-4"
          :class="loginError ? 'opacity-100' : 'opacity-0'"
          x-text="loginError"
        ></p>
      </div>
    </div>

    <!-- Admin Dashboard -->
    <div x-show="authed" x-cloak>
      <header
        class="bg-glass-white dark:bg-glass-dark backdrop-blur-lg fixed top-0 w-full z-50 shadow-sm border-b border-primary/10 dark:border-white/10 flex items-center h-[72px]"
      >
        <div
          class="max-w-5xl w-full mx-auto flex justify-between items-center px-6"
        >
          <div class="flex items-center gap-3">
            <div
              class="h-8 w-8 rounded-full brand-gradient flex items-center justify-center text-white text-xs font-bold shadow-md"
            >
              GH
            </div>
            <h1
              class="text-lg font-bold brand-gradient-text tracking-tight hidden sm:block"
            >
              Product Manager
            </h1>
          </div>
          <div class="flex items-center gap-3">
            <button
              @click="darkMode = !darkMode"
              class="text-on-surface-variant flex items-center justify-center h-10 w-10 rounded-full hover:bg-black/5 dark:hover:bg-white/5 transition-colors"
            >
              <span
                class="material-symbols-outlined"
                x-text="darkMode ? 'light_mode' : 'dark_mode'"
              ></span>
            </button>
            <button
              @click="logout()"
              class="text-sm font-medium text-on-surface-variant hover:text-primary transition-colors border border-outline dark:border-outline-dark px-4 py-1.5 rounded-full hover:bg-black/5 dark:hover:bg-white/5"
            >
              Logout
            </button>
          </div>
        </div>
      </header>

      <main class="pt-[100px] max-w-5xl mx-auto px-4 pb-16">
        <div class="flex gap-2 mb-8 overflow-x-auto no-scrollbar pb-2">
          <button
            @click="tab = 'products'"
            :class="tab === 'products' ? 'brand-gradient text-white shadow-md' : 'bg-glass-white dark:bg-glass-dark border border-outline dark:border-outline-dark text-on-surface-variant'"
            class="px-6 py-2 rounded-full text-sm font-medium transition-all"
          >
            Products
          </button>
          <button
            @click="tab = 'categories'"
            :class="tab === 'categories' ? 'brand-gradient text-white shadow-md' : 'bg-glass-white dark:bg-glass-dark border border-outline dark:border-outline-dark text-on-surface-variant'"
            class="px-6 py-2 rounded-full text-sm font-medium transition-all"
          >
            Categories
          </button>
        </div>

        <!-- PRODUCTS TAB -->
        <div x-show="tab === 'products'">
          <div
            class="bg-glass-white dark:bg-glass-dark backdrop-blur-xl border border-outline dark:border-outline-dark rounded-3xl glass-shadow p-6 md:p-8 mb-8"
          >
            <h2
              class="font-bold text-xl mb-6 brand-gradient-text"
              x-text="editingId ? 'Edit Product' : 'Add New Product'"
            ></h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
              <div>
                <label
                  class="text-xs font-medium text-on-surface-variant mb-1.5 block"
                  >Name (English)</label
                >
                <input
                  x-model="form.pronameen"
                  class="w-full px-4 py-2 bg-white/60 dark:bg-black/30 border border-outline dark:border-outline-dark rounded-xl text-sm focus:outline-none focus:border-primary"
                />
              </div>
              <div>
                <label
                  class="text-xs font-medium text-on-surface-variant mb-1.5 block"
                  >Name (Khmer)</label
                >
                <input
                  x-model="form.pronamekh"
                  class="w-full px-4 py-2 bg-white/60 dark:bg-black/30 border border-outline dark:border-outline-dark rounded-xl text-sm focus:outline-none focus:border-primary"
                />
              </div>
              <div>
                <label
                  class="text-xs font-medium text-on-surface-variant mb-1.5 block"
                  >Category</label
                >
                <div class="flex gap-2">
                  <select
                    x-model="form.procategoryid"
                    class="flex-1 px-4 py-2 bg-white/60 dark:bg-black/30 border border-outline dark:border-outline-dark rounded-xl text-sm focus:outline-none focus:border-primary"
                  >
                    <option value="" disabled>Choose a category</option>
                    <template x-for="cat in categories" :key="cat.catid">
                      <option
                        :value="cat.catid"
                        x-text="cat.catnameen + ' / ' + cat.catnamekh"
                      ></option>
                    </template>
                  </select>
                </div>
              </div>
              <div>
                <label
                  class="text-xs font-medium text-on-surface-variant mb-1.5 block"
                  >Price ($)</label
                >
                <input
                  x-model="form.proprice"
                  type="number"
                  step="0.01"
                  class="w-full px-4 py-2 bg-white/60 dark:bg-black/30 border border-outline dark:border-outline-dark rounded-xl text-sm focus:outline-none focus:border-primary"
                />
              </div>
              <div class="md:col-span-2">
                <label
                  class="text-xs font-medium text-on-surface-variant mb-1.5 block"
                  >Image URL</label
                >
                <input
                  x-model="form.proimageurl"
                  placeholder="https://..."
                  class="w-full px-4 py-2 bg-white/60 dark:bg-black/30 border border-outline dark:border-outline-dark rounded-xl text-sm focus:outline-none focus:border-primary"
                />
              </div>
              <div class="md:col-span-2">
                <label
                  class="text-xs font-medium text-on-surface-variant mb-1.5 block"
                  >Description (English)</label
                >
                <textarea
                  x-model="form.prodescriptionen"
                  rows="2"
                  class="w-full px-4 py-2 bg-white/60 dark:bg-black/30 border border-outline dark:border-outline-dark rounded-xl text-sm focus:outline-none focus:border-primary"
                ></textarea>
              </div>
              <div class="md:col-span-2">
                <label
                  class="text-xs font-medium text-on-surface-variant mb-1.5 block"
                  >Description (Khmer)</label
                >
                <textarea
                  x-model="form.prodescriptionkh"
                  rows="2"
                  class="w-full px-4 py-2 bg-white/60 dark:bg-black/30 border border-outline dark:border-outline-dark rounded-xl text-sm focus:outline-none focus:border-primary"
                ></textarea>
              </div>
            </div>
            <div class="flex gap-3 mt-6">
              <button
                @click="saveProduct()"
                :disabled="saving"
                class="brand-gradient text-white font-medium px-6 py-2.5 rounded-full shadow-md hover:scale-[1.02] transition flex items-center gap-2 disabled:opacity-60"
              >
                <div
                  class="spinner !w-4 !h-4 !border-2 !border-white/30 !border-top-white"
                  x-show="saving"
                ></div>
                <span
                  x-text="editingId ? 'Update Product' : 'Add Product'"
                ></span>
              </button>
              <button
                @click="resetForm()"
                x-show="editingId"
                class="px-6 py-2.5 rounded-full border border-outline dark:border-outline-dark text-sm hover:bg-black/5 dark:hover:bg-white/5 transition"
              >
                Cancel
              </button>
            </div>
            <p
              class="text-red-500 text-xs mt-3"
              x-show="formError"
              x-text="formError"
            ></p>
          </div>

          <!-- Product list -->
          <div
            class="bg-glass-white dark:bg-glass-dark backdrop-blur-xl border border-outline dark:border-outline-dark rounded-3xl glass-shadow overflow-hidden"
          >
            <div
              class="flex items-center justify-between px-6 md:px-8 py-5 border-b border-outline dark:border-outline-dark"
            >
              <h2 class="font-bold text-lg">
                All Products (<span x-text="products.length"></span>)
              </h2>
              <div class="spinner" x-show="loadingList"></div>
            </div>
            <div class="divide-y divide-outline/60 dark:divide-outline-dark">
              <template x-for="p in products" :key="p.proid">
                <div class="flex items-center gap-4 px-6 md:px-8 py-4">
                  <img
                    :src="p.proimageurl"
                    class="w-14 h-14 rounded-xl object-cover border border-outline dark:border-outline-dark flex-shrink-0"
                    onerror="
                      this.src = 'https://placehold.co/100x100?text=No+Image'
                    "
                  />
                  <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2">
                      <p class="font-medium truncate" x-text="p.pronameen"></p>
                      <span
                        class="text-[10px] px-2 py-0.5 rounded-full font-medium"
                        :class="p.status === 'active' ? 'bg-green-100 text-green-700' : 'bg-gray-200 text-gray-500 dark:bg-gray-800 dark:text-gray-400'"
                        x-text="p.status"
                      ></span>
                    </div>
                    <p
                      class="text-xs text-on-surface-variant dark:text-on-surface-variant-dark mt-0.5"
                      x-text="categoryName(p.procategoryid) + ' · $' + Number(p.proprice).toFixed(2)"
                    ></p>
                  </div>
                  <button
                    @click="editProduct(p)"
                    class="text-primary dark:text-primary-light text-sm font-medium hover:underline px-2 hidden sm:block"
                  >
                    Edit
                  </button>
                  <button
                    @click="toggleStatus(p)"
                    class="text-sm font-medium hover:underline px-2 hidden sm:block"
                    x-text="p.status === 'active' ? 'Hide' : 'Show'"
                  ></button>
                  <button
                    @click="removeProduct(p)"
                    class="text-red-500 text-sm font-medium hover:underline pl-2 hidden sm:block"
                  >
                    Delete
                  </button>

                  <div class="sm:hidden flex flex-col gap-1 items-end">
                    <button
                      @click="editProduct(p)"
                      class="text-primary text-xs font-medium"
                    >
                      Edit
                    </button>
                    <button
                      @click="removeProduct(p)"
                      class="text-red-500 text-xs font-medium"
                    >
                      Delete
                    </button>
                  </div>
                </div>
              </template>
              <div
                class="px-6 py-10 text-center text-on-surface-variant text-sm"
                x-show="!loadingList && products.length === 0"
              >
                No products yet — add your first one above.
              </div>
            </div>
          </div>
        </div>

        <!-- CATEGORIES TAB -->
        <div x-show="tab === 'categories'">
          <div
            class="bg-glass-white dark:bg-glass-dark backdrop-blur-xl border border-outline dark:border-outline-dark rounded-3xl glass-shadow p-6 md:p-8 mb-8"
          >
            <h2
              class="font-bold text-xl mb-6 brand-gradient-text"
              x-text="editingCategoryId ? 'Edit Category' : 'Add New Category'"
            ></h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
              <div>
                <label
                  class="text-xs font-medium text-on-surface-variant mb-1.5 block"
                  >Name (English)</label
                >
                <input
                  x-model="categoryForm.catnameen"
                  class="w-full px-4 py-2 bg-white/60 dark:bg-black/30 border border-outline dark:border-outline-dark rounded-xl text-sm focus:outline-none focus:border-primary"
                />
              </div>
              <div>
                <label
                  class="text-xs font-medium text-on-surface-variant mb-1.5 block"
                  >Name (Khmer)</label
                >
                <input
                  x-model="categoryForm.catnamekh"
                  class="w-full px-4 py-2 bg-white/60 dark:bg-black/30 border border-outline dark:border-outline-dark rounded-xl text-sm focus:outline-none focus:border-primary"
                />
              </div>
            </div>
            <div class="flex gap-3 mt-6">
              <button
                @click="saveCategory()"
                class="brand-gradient text-white font-medium px-6 py-2.5 rounded-full shadow-md hover:scale-[1.02] transition flex items-center gap-2"
              >
                <div
                  class="spinner !w-4 !h-4 !border-2 !border-white/30 !border-top-white"
                  x-show="savingCat"
                ></div>
                <span
                  x-text="editingCategoryId ? 'Update Category' : 'Add Category'"
                ></span>
              </button>
              <button
                @click="resetCategoryForm()"
                x-show="editingCategoryId"
                class="px-6 py-2.5 rounded-full border border-outline dark:border-outline-dark text-sm hover:bg-black/5 dark:hover:bg-white/5 transition"
              >
                Cancel
              </button>
            </div>
            <p
              class="text-red-500 text-xs mt-3"
              x-show="categoryFormError"
              x-text="categoryFormError"
            ></p>
          </div>

          <div
            class="bg-glass-white dark:bg-glass-dark backdrop-blur-xl border border-outline dark:border-outline-dark rounded-3xl glass-shadow overflow-hidden"
          >
            <div
              class="px-6 md:px-8 py-5 border-b border-outline dark:border-outline-dark"
            >
              <h2 class="font-bold text-lg">
                All Categories (<span x-text="categories.length"></span>)
              </h2>
            </div>
            <div class="divide-y divide-outline/60 dark:divide-outline-dark">
              <template x-for="c in categories" :key="c.catid">
                <div class="flex items-center gap-4 px-6 md:px-8 py-4">
                  <div class="flex-1 min-w-0">
                    <p
                      class="font-medium"
                      x-text="c.catnameen + ' / ' + c.catnamekh"
                    ></p>
                    <p
                      class="text-xs text-on-surface-variant dark:text-on-surface-variant-dark mt-0.5"
                      x-text="productCountFor(c.catid) + ' product(s) using this category'"
                    ></p>
                  </div>
                  <button
                    @click="editCategory(c)"
                    class="text-primary dark:text-primary-light text-sm font-medium hover:underline px-2"
                  >
                    Edit
                  </button>
                  <button
                    @click="removeCategory(c)"
                    x-show="c.catnameen !== 'Uncategorized'"
                    class="text-red-500 text-sm font-medium hover:underline pl-2"
                  >
                    Delete
                  </button>
                </div>
              </template>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- SMOOTH TOAST NOTIFICATIONS -->
    <div
      class="fixed bottom-6 right-6 z-[100] flex flex-col gap-3 pointer-events-none"
    >
      <template x-for="toast in toasts" :key="toast.id">
        <div
          x-transition:enter="transition ease-out duration-300 transform"
          x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:translate-x-8"
          x-transition:enter-end="opacity-100 translate-y-0 sm:translate-x-0"
          x-transition:leave="transition ease-in duration-200"
          x-transition:leave-start="opacity-100"
          x-transition:leave-end="opacity-0 scale-90"
          class="pointer-events-auto flex items-center gap-3 px-5 py-3.5 rounded-2xl shadow-xl glass-shadow backdrop-blur-xl bg-white/95 dark:bg-zinc-900/95 border border-outline dark:border-outline-dark min-w-[260px]"
        >
          <div class="flex-shrink-0">
            <span
              class="material-symbols-outlined text-green-500"
              x-show="toast.type === 'success'"
              >check_circle</span
            >
            <span
              class="material-symbols-outlined text-red-500"
              x-show="toast.type === 'error'"
              >error</span
            >
            <span
              class="material-symbols-outlined text-primary"
              x-show="toast.type === 'info'"
              >info</span
            >
          </div>
          <p
            class="text-sm font-medium text-on-surface dark:text-on-surface-dark"
            x-text="toast.message"
          ></p>
        </div>
      </template>
    </div>

    <!-- SMOOTH CONFIRMATION MODAL -->
    <div
      class="fixed inset-0 z-[100] flex items-center justify-center p-4"
      x-show="confirmModal.isOpen"
      x-cloak
    >
      <div
        class="absolute inset-0 bg-white/40 backdrop-blur-sm dark:bg-zinc-950/60"
        @click="closeConfirm()"
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100"
        x-transition:leave="transition ease-in duration-200"
        x-transition:leave-start="opacity-100"
        x-transition:leave-end="opacity-0"
      ></div>

      <div
        class="relative w-full max-w-[360px] rounded-3xl bg-glass-white dark:bg-glass-dark backdrop-blur-xl p-8 border border-outline dark:border-outline-dark glass-shadow text-center transform transition-all"
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0 scale-95 translate-y-4"
        x-transition:enter-end="opacity-100 scale-100 translate-y-0"
        x-transition:leave="transition ease-in duration-200"
        x-transition:leave-start="opacity-100 scale-100 translate-y-0"
        x-transition:leave-end="opacity-0 scale-95 translate-y-4"
      >
        <div
          class="mx-auto h-14 w-14 rounded-full bg-red-50 dark:bg-red-900/30 flex items-center justify-center mb-5 text-red-500 border border-red-100 dark:border-red-900/50"
        >
          <span class="material-symbols-outlined text-[28px]">warning</span>
        </div>
        <h3
          class="text-xl font-bold text-on-surface dark:text-on-surface-dark mb-2"
          x-text="confirmModal.title"
        ></h3>
        <p
          class="text-sm text-on-surface-variant dark:text-on-surface-variant-dark mb-8 leading-relaxed"
          x-text="confirmModal.message"
        ></p>

        <div class="flex gap-3 justify-center">
          <button
            @click="closeConfirm()"
            class="flex-1 px-4 py-2.5 rounded-full border border-outline dark:border-outline-dark text-sm font-medium hover:bg-black/5 dark:hover:bg-white/5 transition focus:outline-none focus:ring-2 focus:ring-primary/50 text-on-surface dark:text-on-surface-dark"
          >
            Cancel
          </button>
          <button
            @click="executeConfirm()"
            class="flex-1 px-4 py-2.5 rounded-full bg-red-500 hover:bg-red-600 text-white text-sm font-medium transition shadow-md focus:outline-none focus:ring-2 focus:ring-red-500/50"
          >
            Delete
          </button>
        </div>
      </div>
    </div>

    <script>
      function adminApp() {
        const SUPABASE_URL = "https://apuovezfouaxnrxyphle.supabase.co";
        const SUPABASE_ANON_KEY =
          "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFwdW92ZXpmb3VheG5yeHlwaGxlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMTgxNDQsImV4cCI6MjEwMzU5NDE0NH0.HRuRr_4-6eOneAFZygxnb6oewbxF1TMJOI6xR-lL8wk";
        const supabase = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_ANON_KEY,
        );

        return {
          authed: false,
          darkMode: false,
          emailInput: "",
          passwordInput: "",
          loginError: "",
          showPassword: false,
          formError: "",
          categoryFormError: "",
          saving: false,
          savingCat: false,
          loadingList: false,
          tab: "products",
          products: [],
          categories: [],
          editingId: null,
          editingCategoryId: null,
          form: {
            pronameen: "",
            pronamekh: "",
            prodescriptionen: "",
            prodescriptionkh: "",
            proprice: "",
            procategoryid: "",
            proimageurl: "",
          },
          categoryForm: { catnameen: "", catnamekh: "" },

          toasts: [],
          confirmModal: { isOpen: false, title: "", message: "", action: null },

          async init() {
            const {
              data: { session },
            } = await supabase.auth.getSession();
            if (session) {
              this.authed = true;
              this.loadData();
            }
          },

          showToast(message, type = "success") {
            const id = Date.now();
            this.toasts.push({ id, message, type });
            setTimeout(() => {
              this.toasts = this.toasts.filter((t) => t.id !== id);
            }, 3500);
          },

          confirmAction(title, message, callback) {
            this.confirmModal = {
              isOpen: true,
              title,
              message,
              action: callback,
            };
          },
          closeConfirm() {
            this.confirmModal.isOpen = false;
            setTimeout(() => {
              this.confirmModal.action = null;
            }, 300);
          },
          executeConfirm() {
            if (this.confirmModal.action) this.confirmModal.action();
            this.closeConfirm();
          },

          async login() {
            this.loginError = "";
            this.loadingList = true;
            try {
              const { error } = await supabase.auth.signInWithPassword({
                email: this.emailInput,
                password: this.passwordInput,
              });
              if (error) throw error;

              this.authed = true;
              await this.loadData();
              this.showToast("Logged in successfully!");
            } catch (err) {
              this.loginError = err.message || "Login failed.";
            }
            this.loadingList = false;
          },

          async logout() {
            await supabase.auth.signOut();
            this.authed = false;
            this.emailInput = "";
            this.passwordInput = "";
            this.showPassword = false;
            this.showToast("Logged out.", "info");
          },

          async loadData() {
            const { data: catData, error: catErr } = await supabase
              .from("categories")
              .select("*")
              .order("audit", { ascending: true });
            const { data: proData, error: proErr } = await supabase
              .from("products")
              .select("*")
              .order("audit", { ascending: false });
            if (catErr) console.error(catErr);
            if (proErr) console.error(proErr);
            this.categories = catData || [];
            this.products = proData || [];
          },

          categoryName(catid) {
            const cat = this.categories.find((c) => c.catid === catid);
            return cat
              ? cat.catnameen + " / " + cat.catnamekh
              : "(no category)";
          },

          productCountFor(catid) {
            return this.products.filter((p) => p.procategoryid === catid)
              .length;
          },

          resetForm() {
            this.editingId = null;
            this.form = {
              pronameen: "",
              pronamekh: "",
              prodescriptionen: "",
              prodescriptionkh: "",
              proprice: "",
              procategoryid: "",
              proimageurl: "",
            };
            this.formError = "";
          },

          editProduct(p) {
            this.editingId = p.proid;
            this.form = { ...p };
            window.scrollTo({ top: 0, behavior: "smooth" });
          },

          async saveProduct() {
            this.formError = "";
            if (!this.form.pronameen || !this.form.proprice)
              return (this.formError = "Name (English) and Price required.");
            if (!this.form.procategoryid)
              return (this.formError = "Choose a category.");

            this.saving = true;
            try {
              const payload = {
                ...this.form,
                proprice: Number(this.form.proprice) || 0,
              };

              if (this.editingId) {
                const { error } = await supabase
                  .from("products")
                  .update(payload)
                  .eq("proid", this.editingId);
                if (error) throw error;
              } else {
                const { error } = await supabase
                  .from("products")
                  .insert([payload]);
                if (error) throw error;
              }

              await this.loadData();
              this.showToast(
                this.editingId
                  ? "Product updated successfully!"
                  : "Product added successfully!",
              );
              this.resetForm();
            } catch (err) {
              this.showToast(err.message, "error");
            }
            this.saving = false;
          },

          async toggleStatus(p) {
            try {
              const nextStatus = p.status === "active" ? "hidden" : "active";
              const { error } = await supabase
                .from("products")
                .update({ status: nextStatus })
                .eq("proid", p.proid);
              if (error) throw error;
              p.status = nextStatus;
              this.showToast(`Product visibility updated.`, "success");
            } catch (err) {
              this.showToast(err.message, "error");
            }
          },

          removeProduct(p) {
            this.confirmAction(
              "Delete Product",
              `Are you sure you want to permanently delete "${p.pronameen}"?`,
              async () => {
                try {
                  const { error } = await supabase
                    .from("products")
                    .delete()
                    .eq("proid", p.proid);
                  if (error) throw error;
                  this.products = this.products.filter(
                    (prod) => prod.proid !== p.proid,
                  );
                  this.showToast("Product deleted.", "success");
                } catch (err) {
                  this.showToast(err.message, "error");
                }
              },
            );
          },

          resetCategoryForm() {
            this.editingCategoryId = null;
            this.categoryForm = { catnameen: "", catnamekh: "" };
            this.categoryFormError = "";
          },

          editCategory(c) {
            this.editingCategoryId = c.catid;
            this.categoryForm = {
              catnameen: c.catnameen,
              catnamekh: c.catnamekh,
            };
            window.scrollTo({ top: 0, behavior: "smooth" });
          },

          async saveCategory() {
            this.categoryFormError = "";
            if (!this.categoryForm.catnameen || !this.categoryForm.catnamekh)
              return (this.categoryFormError = "Both names required.");

            this.savingCat = true;
            try {
              const payload = { ...this.categoryForm };

              if (this.editingCategoryId) {
                const { error } = await supabase
                  .from("categories")
                  .update(payload)
                  .eq("catid", this.editingCategoryId);
                if (error) throw error;
              } else {
                const { error } = await supabase
                  .from("categories")
                  .insert([payload]);
                if (error) throw error;
              }

              await this.loadData();
              this.showToast(
                this.editingCategoryId
                  ? "Category updated!"
                  : "Category added!",
              );
              this.resetCategoryForm();
            } catch (err) {
              this.showToast(err.message, "error");
            }
            this.savingCat = false;
          },

          removeCategory(c) {
            const count = this.productCountFor(c.catid);
            const warningMsg =
              count > 0
                ? `Are you sure you want to delete "${c.catnameen}"? The ${count} products in this category will be moved to "Uncategorized".`
                : `Are you sure you want to delete "${c.catnameen}"?`;

            this.confirmAction("Delete Category", warningMsg, async () => {
              try {
                if (count > 0) {
                  let { data: uncat } = await supabase
                    .from("categories")
                    .select("catid")
                    .eq("catnameen", "Uncategorized")
                    .single();
                  if (!uncat) {
                    const { data: newUncat } = await supabase
                      .from("categories")
                      .insert({
                        catnameen: "Uncategorized",
                        catnamekh: "មិនទាន់មានប្រភេទ",
                      })
                      .select()
                      .single();
                    uncat = newUncat;
                  }
                  await supabase
                    .from("products")
                    .update({ procategoryid: uncat.catid })
                    .eq("procategoryid", c.catid);
                }

                const { error } = await supabase
                  .from("categories")
                  .delete()
                  .eq("catid", c.catid);
                if (error) throw error;

                await this.loadData();
                this.showToast("Category deleted.", "success");
                if (count > 0)
                  this.showToast(
                    `${count} product(s) moved to Uncategorized.`,
                    "info",
                  );
              } catch (err) {
                this.showToast(err.message, "error");
              }
            });
          },
        };
      }
    </script>
  </body>
</html>
